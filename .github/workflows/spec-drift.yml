name: Spec drift

# Keeps the pinned API version, the vendored spec, the targeted schema list, the
# operations manifest, and the hand-written client/models in lockstep
# (scripts/check-spec-drift.mjs), and proves the vendored spec still byte-matches
# the authoritative upstream spec at the pinned tag.
#
# Runs on EVERY pull request, deliberately with no `paths` filter (ENG-7963).
# A filtered version of this job looks correct and does nothing in the two cases
# that matter most:
#   * a pin-only bump PR — the pin *is* the change, and a filter keyed on the
#     spec file would skip the check that decides whether the bump is safe;
#   * a code-only PR that adds a client method for an operation nobody added to
#     endpoints.txt — invariant H exists to fail that, so it has to run.
# The checker is dependency-free and finishes in well under a second, so there is
# nothing to buy by narrowing it.
#
# Network: the invariants themselves are hermetic — they read the vendored
# spec/openapi.json, never the network, so they cannot go red because GitHub was
# slow. Only the tag-match step below reaches upstream, and it is cached by the
# pinned version, so a normal run does no network at all.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The checker's own red-tests (each invariant defeated in a sandboxed copy
      # of the drift inputs) live in test/models.test.ts and run in the CI `test`
      # job, which already has the toolchain for them. This job stays
      # dependency-free — node and nothing else — so it starts in seconds.
      - name: Check pin, spec, schemas, models, and operations are in sync
        run: node scripts/check-spec-drift.mjs

      - name: Read pinned spec version
        id: pin
        run: |
          tag="$(tr -d '[:space:]' < .api-version)"
          # Validate before it reaches any URL / cache key: a crafted
          # .api-version on a fork PR could otherwise inject into the fetch.
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::.api-version must look like vX.Y.Z (got: '$tag')"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Cache the upstream spec
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: openapi.upstream.json
          key: spec-${{ steps.pin.outputs.tag }}

      - name: Fetch upstream spec (cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # Passed via env (not interpolated into the script) so the tag is
          # data, not code; validated to ^v[0-9.]+$ in the pin step above.
          SPEC_TAG: ${{ steps.pin.outputs.tag }}
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/nexus-xyz/nexus-exchange-api/${SPEC_TAG}/openapi.json" \
            -o openapi.upstream.json

      # Ported from the monorepo's `eng-exchange-api-vendored-check.yml`
      # tag-match job. Vendoring buys hermetic CI and byte-pinning, but it opens
      # one hole rs structurally cannot have: someone can edit spec/openapi.json
      # by hand and make every invariant above go green against a spec that no
      # release ever contained. This closes it — the vendored file must be the
      # released bytes, not merely a file that parses.
      #
      # Byte-exact, not jq-normalized: .prettierignore already excludes
      # spec/openapi.json precisely so it stays verbatim, so there is no
      # formatting difference to tolerate, and byte-pinning is the property being
      # claimed. Re-vendor with `pnpm run bump:spec <tag>`, never by hand.
      - name: Vendored spec byte-matches the released tag
        env:
          SPEC_TAG: ${{ steps.pin.outputs.tag }}
        run: |
          if ! cmp -s spec/openapi.json openapi.upstream.json; then
            echo "::error::spec/openapi.json does not byte-match nexus-exchange-api@${SPEC_TAG}."
            echo "::error::Do not hand-edit the vendored spec. Re-vendor from the released tag:"
            echo "::error::  pnpm run bump:spec ${SPEC_TAG}"
            diff <(node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync("spec/openapi.json","utf8")),null,2))') \
                 <(node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync("openapi.upstream.json","utf8")),null,2))') \
              | head -40 || true
            exit 1
          fi
          echo "Vendored spec byte-matches nexus-exchange-api@${SPEC_TAG}."
          # Byte-equality makes re-running the checker against openapi.upstream.json
          # identical to the hermetic run above, so it is not repeated here.
