name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      # `typecheck` covers only src/ — it is the build config, which emits dist/
      # from rootDir: src. This is what checks test/ and examples/ (ENG-7726);
      # without it `pnpm test` runs through tsx, which strips types without
      # checking them, so a type-invalid fixture or a broken shipped example
      # keeps CI green. It is also the only thing pinning the hand-written models
      # to the spec's field TYPES — check:drift compares schema names and enum
      # members, never a property's type.
      - run: pnpm run typecheck:test
      - run: pnpm run build
      # Prove the artifact pnpm would publish installs and imports cleanly — the
      # same check the release workflow re-runs before `pnpm publish`.
      - run: pnpm run verify:pack

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
