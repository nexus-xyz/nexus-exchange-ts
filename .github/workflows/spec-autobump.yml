name: Spec autobump

# Detect a new nexus-exchange-api spec release and open a re-vendoring PR
# (ENG-7963, replicating the ENG-3563 reference in nexus-exchange-rs).
#
# Until this landed, NOTHING in this repo noticed a newer spec: bumps were
# entirely manual, so the SDK could fall arbitrarily far behind and no workflow
# would say so. Verification (`spec-drift.yml`) came first on purpose — an
# autobump in a repo without a drift check just manufactures ungated pin
# advances at machine speed, which is how nexus-exchange-py ended up with a
# manifest describing six operations that never existed (ENG-7958).
#
# Triggers: the api repo fans out a `repository_dispatch` (`spec-released`,
# carrying the tag) on release; a daily `schedule` poll is the self-healing
# fallback if a dispatch is dropped; `workflow_dispatch` is the manual path.
#
# Either way this workflow:
#   1. resolves the target tag and confirms it is newer than `.api-version`,
#   2. classifies vendored-spec -> target with oasdiff (ERR ⇒ breaking),
#   3. RE-VENDORS spec/openapi.json and bumps `.api-version`
#      (scripts/bump-api-spec.mjs), and opens a PR.
#
# ── Why this re-vendors instead of copying rs verbatim ────────────────────────
#
# rs and py store only a tag and download the spec when their check runs, so a
# bump PR there is two files. This repo stores a byte-pinned 189 KB copy at
# spec/openapi.json, and invariant A in scripts/check-spec-drift.mjs ties the tag
# to that file's `info.version`. rs's autobump dropped in unchanged would leave
# `.api-version` at the new tag and the vendored spec at the old one — red on
# arrival for a bookkeeping reason, which is the worst kind of red: it teaches
# people to ignore the check.
#
# Vendoring is kept, and the bot taught to re-vendor, because vendoring buys
# three things rs does not have: hermetic invariants (no network, so GitHub being
# slow can't present as a drift finding), byte-pinning (a force-retagged release
# cannot silently change what the SDK was validated against), and a reviewable
# contract diff (the bump PR shows exactly what changed in the API). It is also
# the house pattern — the monorepo vendors the same spec the same way, and
# `spec-drift.yml`'s tag-match step is ported from its vendored-spec check.
#
# ── Expect redder bump PRs here than in rs ───────────────────────────────────
#
# Re-vendoring puts the whole new spec in scope, so a release that adds a schema,
# an enum member, or an operation fails drift until models.ts and the manifests
# catch up. That is a property of this SDK hand-writing its models, not of
# vendoring — switching to rs's fetch model would hide the contract diff while
# the same work got done. So `spec-autobump` needs a repo-specific reading:
# oasdiff-non-breaking here still frequently means work.
#
# ── Auto-merge ───────────────────────────────────────────────────────────────
#
# `allow_auto_merge` is disabled on this repository, so rs's arming step would
# silently no-op. The step below probes the setting and says plainly that a human
# must merge rather than pretending the PR will land itself. Even with the
# setting enabled, actual auto-landing waits on the ENG-4149 ruleset bypass.

on:
  repository_dispatch:
    types: [spec-released]
  schedule:
    # Daily fallback poll; the dispatch from the api repo is the fast path.
    # NOTE: this repo is not yet in the api repo's `spec-dispatch.yml` matrix
    # (it lists only nexus-exchange-rs), so until that entry is added the poll
    # IS the only path — a bump arrives within a day rather than within minutes.
    - cron: "41 8 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Spec tag to evaluate (e.g. v0.7.2). Defaults to api repo latest."
        required: false

permissions:
  contents: write
  pull-requests: write
  # Labels live on the issues API, so applying (and creating) them needs this.
  issues: write

concurrency:
  # Serialize on the workflow, not the tag: two near-simultaneous releases must
  # not race to bump the same pin.
  group: spec-autobump
  cancel-in-progress: false

env:
  SPEC_REPO: nexus-xyz/nexus-exchange-api

jobs:
  autobump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Use the bump token (ENG-4149) so the opened PR triggers the required
          # checks (drift, CI). A PR opened with the default GITHUB_TOKEN does
          # not trigger other workflows, which would wedge auto-merge forever.
          token: ${{ secrets.SDK_DISPATCH_TOKEN || github.token }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Resolve target tag
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }} # lifts the releases-API rate limit
          # Dispatch payload tag is repo-controlled, but keep it as data.
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            # Scheduled path: ask the api repo for its latest release tag.
            tag="$(gh api "repos/${SPEC_REPO}/releases/latest" --jq .tag_name)"
          fi
          # Validate strictly before the tag reaches a URL, a file, or a branch
          # name — a dispatch payload is untrusted data. bump-api-spec.mjs
          # re-validates it for the same reason.
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::resolved tag is not vX.Y.Z: '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "pinned=$(tr -d '[:space:]' < .api-version)" >> "$GITHUB_OUTPUT"
          echo "Resolved target tag: $tag (currently pinned: $(cat .api-version))"

      - name: Stop if not newer than the pin
        id: gate
        env:
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # exit 3 == the pin is behind (a newer spec exists); 0 == at/ahead.
          # Same contract as the Rust SDK's sync_api_version.py --check.
          set +e
          node scripts/bump-api-spec.mjs --check "$NEW_TAG"
          rc=$?
          set -e
          case "$rc" in
            0) echo "proceed=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "proceed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::bump-api-spec.mjs --check failed (exit $rc)"; exit "$rc" ;;
          esac

      - name: Fetch the target spec
        if: steps.gate.outputs.proceed == 'true'
        env:
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Only the NEW spec needs fetching: the old side of the diff is the
          # byte-pinned copy already in the tree. Raw-at-tag URL, not the release
          # asset — the asset's download_count is reserved as an external
          # adoption signal.
          curl -fsSL "https://raw.githubusercontent.com/${SPEC_REPO}/${NEW_TAG}/openapi.json" \
            -o /tmp/spec-new.json

      - name: Install oasdiff
        if: steps.gate.outputs.proceed == 'true'
        run: curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh

      - name: Classify vendored spec -> target with oasdiff
        if: steps.gate.outputs.proceed == 'true'
        id: oasdiff
        run: |
          set -euo pipefail
          # Informational changelog in the log for the PR reviewer.
          oasdiff changelog spec/openapi.json /tmp/spec-new.json || true

          # Capture the breaking summary for the PR body.
          oasdiff breaking spec/openapi.json /tmp/spec-new.json --format text \
            > /tmp/oasdiff-breaking.txt 2>&1 || true

          # The classification: same gate the api repo's "Classify API changes"
          # uses. `--fail-on ERR` exits non-zero iff there is an ERR-level
          # (breaking) change; WARN/INFO-level changes are non-breaking.
          if oasdiff breaking spec/openapi.json /tmp/spec-new.json --fail-on ERR; then
            echo "verdict=non-breaking" >> "$GITHUB_OUTPUT"
            echo "No ERR-level (breaking) changes — NON-BREAKING."
          else
            echo "verdict=breaking" >> "$GITHUB_OUTPUT"
            echo "ERR-level (breaking) change(s) detected — BREAKING."
          fi

      - name: Re-vendor the spec and bump the pin
        if: steps.gate.outputs.proceed == 'true'
        env:
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
        run: node scripts/bump-api-spec.mjs "$NEW_TAG"

      # Probe rather than assume. `gh pr merge --auto` fails outright when the
      # repository has auto-merge disabled, which would fail this job *after*
      # pushing the branch — and a red autobump job trains people to ignore it.
      - name: Check whether auto-merge is available
        if: steps.gate.outputs.proceed == 'true'
        id: automerge
        env:
          GH_TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge')" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::allow_auto_merge is disabled on ${GITHUB_REPOSITORY}; the bump PR will need a human to merge it. Enable the repository setting to arm auto-merge (actual auto-landing still waits on ENG-4149)."
          fi

      # `gh pr create --label` fails on a label the repo doesn't have, and this
      # repo has neither of the two (rs, where the pattern originated, does).
      # Create them idempotently rather than pushing a branch and then failing on
      # the label — and rather than relying on someone having clicked them into
      # existence in repo settings. Descriptions/colours match rs so the fleet
      # reads the same.
      - name: Ensure the autobump labels exist
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh label create "spec-autobump" --color 0e8a16 \
            --description "Automated non-breaking spec re-vendor + pin bump (ENG-3563)" \
            --force
          gh label create "breaking · needs-SDK-update" --color d93f0b \
            --description "Spec bump is breaking; needs human SDK changes (ENG-3563)" \
            --force

      - name: Open the bump PR
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN || github.token }}
          NEW_TAG: ${{ steps.resolve.outputs.tag }}
          OLD_TAG: ${{ steps.resolve.outputs.pinned }}
          VERDICT: ${{ steps.oasdiff.outputs.verdict }}
          AUTO_MERGE: ${{ steps.automerge.outputs.available }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No file change after the bump — nothing to open."
            exit 0
          fi

          branch="chore/spec-autobump-${NEW_TAG}"

          # Idempotent: if the branch already exists upstream, or an open PR is
          # already on it, leave it rather than churning a duplicate each poll.
          # This matters more here than in rs: a human will often have pushed
          # models.ts / manifest commits onto this branch, and re-running must
          # never clobber them.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists upstream; nothing to do."
            exit 0
          fi
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "An open PR for $branch already exists; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .api-version spec/openapi.json
          git commit -m "chore(spec): re-vendor spec ${OLD_TAG} -> ${NEW_TAG}"
          git push --set-upstream origin "$branch"

          arm="unavailable"
          if [ "$AUTO_MERGE" = "true" ]; then arm="armed"; fi
          node scripts/render-autobump-pr-body.mjs \
            --new-tag "$NEW_TAG" \
            --old-tag "$OLD_TAG" \
            --verdict "$VERDICT" \
            --oasdiff-file /tmp/oasdiff-breaking.txt \
            --auto-merge "$arm" \
            > "$RUNNER_TEMP/pr-body.md"

          title="chore(spec): re-vendor spec ${OLD_TAG} -> ${NEW_TAG}"
          if [ "$VERDICT" = "non-breaking" ]; then
            gh pr create --base main --head "$branch" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --label "spec-autobump"
            # Arm auto-merge (squash) only where it can actually work. Gated on
            # required checks + the ENG-4149 bypass; cannot merge until both.
            if [ "$AUTO_MERGE" = "true" ]; then
              gh pr merge "$branch" --auto --squash
            fi
          else
            gh pr create --base main --head "$branch" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --label "breaking · needs-SDK-update"
            # Route to a human; do NOT arm auto-merge.
            gh pr edit "$branch" --add-reviewer nexus-xyz/eng || \
              echo "::warning::could not request review (team handle may differ); add a reviewer manually."
          fi
